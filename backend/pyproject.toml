[project]
name = "concierge-backend"
version = "0.1.0"
description = "AI Concierge Backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.51.0",
    "openai-agents>=0.0.9",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tiktoken>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis>=5.2.1",
    "python-jose[cryptography]>=3.3.0",
    "sendgrid>=6.11.0",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fakeredis>=2.26.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
