# Render deployment blueprint for the Aueshah Concierge backend.
#
# How to deploy:
#   1. Push this repo to GitHub (the branch below).
#   2. In Render dashboard → Blueprints → "New Blueprint Instance" → connect this repo.
#   3. Render reads this file, creates the service, and prompts for secrets
#      (every env var with `sync: false`).
#   4. Click "Apply"; first build takes ~3–5 min.
#
# Secrets you must paste in (sync: false):
#   OPENAI_API_KEY, QDRANT_URL, QDRANT_API_KEY, NEON_DATABASE_URL,
#   JWT_AUTH_SECRET_KEY (must equal the value in aueshah.com's wp-config.php),
#   RESEND_API_KEY.
#
# Auto-generated by Render (generateValue: true):
#   JWT_SIGNING_KEY, ADMIN_API_TOKEN.
#
# Optional (uncomment + set later when you have them):
#   REDIS_URL (unlocks the rate limiter), SLACK_WEBHOOK_NOOR, SLACK_WEBHOOK_APPOINTMENTS.
#
# After first successful deploy:
#   - Update the WP widget BACKEND const on aueshah.com/bespoke/ to point at the
#     Render service URL (e.g. https://aueshah-concierge.onrender.com).
#   - Lock CORS in app/main.py to https://aueshah.com (today it's wildcard).
#   - Re-run scripts/load_rag.py against Qdrant to re-embed at 3072 dims.
#
# Spec reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aueshah-concierge
    runtime: docker
    plan: starter            # free tier sleeps after 15min idle — starter recommended
    region: virginia         # us-east-1, matches Neon ep-soft-base-an05ulxi
    branch: 001-concierge-chat-api
    rootDir: backend
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    # Optional: run Alembic migrations on every deploy (idempotent).
    # Uncomment when your Neon connection from Render is verified.
    # preDeployCommand: "uv run alembic upgrade head"

    envVars:
      # ─── OpenAI (REQUIRED) ────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1

      # ─── Qdrant (REQUIRED) ────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: aueshah_knowledge
      - key: EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: EMBEDDING_DIM
        value: "3072"

      # ─── Neon Postgres (REQUIRED) ─────────────────────────────
      # Use the pooled connection string (-pooler in host).
      - key: NEON_DATABASE_URL
        sync: false

      # ─── WordPress auth (REQUIRED) ────────────────────────────
      # JWT_AUTH_SECRET_KEY must match aueshah.com wp-config.php.
      - key: JWT_AUTH_SECRET_KEY
        sync: false
      - key: WP_BASE_URL
        value: https://aueshah.com
      - key: WP_ISSUER
        value: https://aueshah.com

      # ─── Resend email (REQUIRED for appointment + Noor flows) ──
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Aueshah Concierge <onboarding@resend.dev>"
      - key: CONCIERGE_ALERT_EMAIL
        value: husnainxebad@gmail.com

      # ─── Session JWT + admin (auto-generated) ─────────────────
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: JWT_EXPIRES_SECONDS
        value: "86400"

      # ─── Timeouts + behavior (sane defaults — tune in dashboard) ──
      - key: CHAT_TIMEOUT_SECONDS
        value: "3"
      - key: RAG_TIMEOUT_SECONDS
        value: "2.5"
      - key: ROUTING_TIMEOUT_MS
        value: "200"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_CONTEXT_MESSAGES
        value: "15"
      - key: ENABLE_RAG
        value: "true"
      - key: ENABLE_RETRY
        value: "true"
      - key: MAX_RETRIES
        value: "2"
      - key: NOOR_COOLDOWN_DAYS
        value: "365"
      - key: NOOR_MAX_ALLOCATIONS
        value: "143"

      # ─── Logging + runtime ────────────────────────────────────
      # LOG_LEVEL must be lowercase (uvicorn rejects uppercase values).
      - key: LOG_LEVEL
        value: info
      - key: UVICORN_WORKERS
        value: "2"

      # ─── Optional: rate limiting (needs Redis) ────────────────
      # - key: REDIS_URL
      #   sync: false
      # - key: RATE_LIMIT_PER_MIN
      #   value: "5"
      # - key: ENABLE_RATE_LIMIT
      #   value: "true"

      # ─── Optional: Slack notifications ────────────────────────
      # - key: SLACK_WEBHOOK_NOOR
      #   sync: false
      # - key: SLACK_WEBHOOK_APPOINTMENTS
      #   sync: false
